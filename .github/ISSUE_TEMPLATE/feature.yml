name: Feature request
description: Propose a focused improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, alternatives, or constraints.
